<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 420" width="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="bluebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="amberbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="scangrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(59,130,246,0)"/>
      <stop offset="0.5" stop-color="rgba(56,189,248,0.5)"/>
      <stop offset="1" stop-color="rgba(59,130,246,0)"/>
    </linearGradient>
    <radialGradient id="radar" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(56,189,248,0.35)"/><stop offset="1" stop-color="rgba(56,189,248,0)"/>
    </radialGradient>
    <style>
      @keyframes scany { 0%{transform:translateY(0)} 100%{transform:translateY(560px)} }
      @keyframes sweep { from{transform:rotate(0)} to{transform:rotate(360deg)} }
      @keyframes wheels { from{transform:rotate(0)} to{transform:rotate(360deg)} }
      @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
      @keyframes dash { from{stroke-dashoffset:60} to{stroke-dashoffset:0} }
      @keyframes tw { 0%,100%{opacity:.35} 50%{opacity:1} }
      @keyframes barblue { 0%{width:8px} 50%{width:58px} 100%{width:30px} }
      @keyframes baramber { 0%{width:46px} 50%{width:12px} 100%{width:36px} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes movel { 0%{transform:translateX(0)} 100%{transform:translateX(-40px)} }
      @keyframes mover { 0%{transform:translateX(0)} 100%{transform:translateX(40px)} }
      @keyframes ping { 0%{opacity:.8;r:4} 100%{opacity:0;r:22} }
      .scany{animation:scany 3s linear infinite;}
      .sweep{animation:sweep 3s linear infinite;transform-origin:150px 235px;}
      .wheell{animation:wheels 1.1s linear infinite;transform-origin:120px 300px;}
      .wheelr{animation:wheels 1.1s linear infinite;transform-origin:180px 300px;}
      .bob{animation:bob 2.2s ease-in-out infinite;}
      .tw1{animation:tw 1.4s ease-in-out infinite;}
      .tw2{animation:tw 1.4s ease-in-out .35s infinite;}
      .tw3{animation:tw 1.4s ease-in-out .7s infinite;}
      .bl{animation:barblue 3s ease-in-out infinite;}
      .ba{animation:baramber 3s ease-in-out infinite;}
      .cursor{animation:blink 1s steps(1) infinite;}
      .moveL{animation:movel 2.4s ease-in-out infinite alternate;}
      .moveR{animation:mover 2.4s ease-in-out infinite alternate;}
      .ping{animation:ping 2s ease-out infinite;}
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="rgba(59,130,246,0.08)" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="32" x2="1200" y2="32"/><line x1="0" y1="64" x2="1200" y2="64"/><line x1="0" y1="96" x2="1200" y2="96"/><line x1="0" y1="128" x2="1200" y2="128"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="192" x2="1200" y2="192"/><line x1="0" y1="224" x2="1200" y2="224"/><line x1="0" y1="256" x2="1200" y2="256"/><line x1="0" y1="288" x2="1200" y2="288"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="352" x2="1200" y2="352"/><line x1="0" y1="384" x2="1200" y2="384"/><line x1="0" y1="416" x2="1200" y2="416"/>
    <line x1="0" y1="0" x2="0" y2="420"/><line x1="32" y1="0" x2="32" y2="420"/><line x1="64" y1="0" x2="64" y2="420"/><line x1="96" y1="0" x2="96" y2="420"/><line x1="128" y1="0" x2="128" y2="420"/><line x1="160" y1="0" x2="160" y2="420"/><line x1="192" y1="0" x2="192" y2="420"/><line x1="224" y1="0" x2="224" y2="420"/><line x1="256" y1="0" x2="256" y2="420"/><line x1="288" y1="0" x2="288" y2="420"/><line x1="320" y1="0" x2="320" y2="420"/><line x1="352" y1="0" x2="352" y2="420"/><line x1="384" y1="0" x2="384" y2="420"/><line x1="416" y1="0" x2="416" y2="420"/><line x1="448" y1="0" x2="448" y2="420"/><line x1="480" y1="0" x2="480" y2="420"/><line x1="512" y1="0" x2="512" y2="420"/><line x1="544" y1="0" x2="544" y2="420"/><line x1="576" y1="0" x2="576" y2="420"/><line x1="608" y1="0" x2="608" y2="420"/><line x1="640" y1="0" x2="640" y2="420"/><line x1="672" y1="0" x2="672" y2="420"/><line x1="704" y1="0" x2="704" y2="420"/><line x1="736" y1="0" x2="736" y2="420"/><line x1="768" y1="0" x2="768" y2="420"/><line x1="800" y1="0" x2="800" y2="420"/><line x1="832" y1="0" x2="832" y2="420"/><line x1="864" y1="0" x2="864" y2="420"/><line x1="896" y1="0" x2="896" y2="420"/><line x1="928" y1="0" x2="928" y2="420"/><line x1="960" y1="0" x2="960" y2="420"/><line x1="992" y1="0" x2="992" y2="420"/><line x1="1024" y1="0" x2="1024" y2="420"/><line x1="1056" y1="0" x2="1056" y2="420"/><line x1="1088" y1="0" x2="1088" y2="420"/><line x1="1120" y1="0" x2="1120" y2="420"/><line x1="1152" y1="0" x2="1152" y2="420"/><line x1="1184" y1="0" x2="1184" y2="420"/>
  </g>

  <!-- title -->
  <text x="60" y="42" font-family="DejaVu Sans Mono,monospace" font-size="20" font-weight="bold" fill="#e2e8f0">
    ROS 2 <tspan fill="#38bdf8">Jazzy</tspan> <tspan fill="#fbbf24">Robotics Telemetry</tspan> Suite
  </text>
  <text x="60" y="66" font-family="DejaVu Sans Mono,monospace" font-size="12" fill="rgba(148,163,184,0.9)">
    /mobile_robot <tspan fill="#60a5fa">&#9679;</tspan> /arm <tspan fill="#f59e0b">&#9679;</tspan> /telemetry <tspan fill="#34d399">&#9679; live</tspan>
    <tspan fill="rgba(148,163,184,0.6)">    ros2 run ...</tspan><tspan class="cursor" fill="#38bdf8">&#9608;</tspan>
  </text>

  <!-- left telemetry panel -->
  <g>
    <rect x="60" y="92" width="240" height="210" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(59,130,246,0.3)"/>
    <text x="78" y="118" font-family="DejaVu Sans Mono,monospace" font-size="11" fill="#fbbf24">/odom</text>
    <text x="78" y="140" font-family="DejaVu Sans Mono,monospace" font-size="12" fill="#e2e8f0">x: <tspan class="tw1" fill="#38bdf8">1.42</tspan>  y: <tspan class="tw2" fill="#38bdf8">-0.63</tspan></text>
    <text x="78" y="162" font-family="DejaVu Sans Mono,monospace" font-size="12" fill="#e2e8f0">theta: <tspan class="tw3" fill="#38bdf8">0.87 rad</tspan></text>
    <rect x="78" y="176" width="150" height="6" rx="3" fill="rgba(59,130,246,0.15)"/>
    <rect x="78" y="176" width="96" height="6" rx="3" fill="url(#bluebar)" class="bl"/>

    <text x="78" y="206" font-family="DejaVu Sans Mono,monospace" font-size="11" fill="#fbbf24">/scan</text>
    <text x="78" y="228" font-family="DejaVu Sans Mono,monospace" font-size="12" fill="#e2e8f0">obstacles: <tspan class="tw2" fill="#fbbf24">3</tspan>  nearest: <tspan class="tw1" fill="#fbbf24">0.38m</tspan></text>
    <rect x="78" y="242" width="150" height="6" rx="3" fill="rgba(251,191,36,0.12)"/>
    <rect x="78" y="242" width="52" height="6" rx="3" fill="url(#amberbar)" class="ba"/>

    <text x="78" y="272" font-family="DejaVu Sans Mono,monospace" font-size="11" fill="#fbbf24">/joint_states</text>
    <text x="78" y="292" font-family="DejaVu Sans Mono,monospace" font-size="12" fill="#e2e8f0">pick: <tspan class="tw3" fill="#38bdf8">[2.1,-1.2,0.8]</tspan></text>
  </g>

  <!-- robot scene -->
  <g>
    <!-- ground -->
    <line x1="320" y1="330" x2="880" y2="330" stroke="rgba(59,130,246,0.3)"/>
    <line x1="320" y1="336" x2="880" y2="336" stroke="rgba(59,130,246,0.12)"/>

    <!-- radar -->
    <circle cx="600" cy="235" r="110" fill="url(#radar)"/>
    <circle cx="600" cy="235" r="110" fill="none" stroke="rgba(56,189,248,0.35)"/>
    <circle cx="600" cy="235" r="76" fill="none" stroke="rgba(56,189,248,0.2)"/>
    <circle cx="600" cy="235" r="40" fill="none" stroke="rgba(56,189,248,0.15)"/>
    <g class="sweep">
      <path d="M600 235 L600 125 A110 110 0 0 1 705 155 Z" fill="rgba(56,189,248,0.18)"/>
      <line x1="600" y1="235" x2="600" y2="125" stroke="#38bdf8" stroke-width="2"/>
    </g>
    <!-- obstacles -->
    <g class="moveL">
      <rect x="660" y="300" width="14" height="30" fill="#475569" stroke="#94a3b8" rx="3"/>
      <circle cx="667" cy="312" r="3" fill="#f59e0b"/>
    </g>
    <g class="moveR">
      <rect x="520" y="305" width="12" height="25" fill="#475569" stroke="#94a3b8" rx="3"/>
    </g>
    <!-- ping dots -->
    <circle cx="648" cy="270" r="4" fill="#38bdf8" class="ping"/>

    <!-- mobile robot base -->
    <g class="bob">
      <rect x="110" y="270" width="80" height="30" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="120" cy="300" r="14" fill="#0f172a" stroke="#60a5fa" stroke-width="2" class="wheell"/>
      <circle cx="180" cy="300" r="14" fill="#0f172a" stroke="#60a5fa" stroke-width="2" class="wheelr"/>
      <line x1="113" y1="300" x2="127" y2="300" stroke="#f59e0b" stroke-width="2"/>
      <line x1="173" y1="300" x2="187" y2="300" stroke="#f59e0b" stroke-width="2"/>
      <!-- LiDAR turret -->
      <g class="sweep" style="transform-origin:150px 255px">
        <circle cx="150" cy="255" r="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
        <line x1="150" y1="255" x2="150" y2="225" stroke="#f59e0b" stroke-width="3"/>
      </g>
      <!-- arm -->
      <g>
    <circle cx="150" cy="262" r="22.4" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="150" cy="262" r="9.799999999999999" fill="#f59e0b"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="35 150 262;-30 150 262;35 150 262" dur="6s" repeatCount="indefinite"/>
      <rect x="150" y="257.8" width="47.599999999999994" height="8.399999999999999" rx="3" fill="#60a5fa"/>
      <circle cx="197.6" cy="262" r="7.0" fill="#fbbf24"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="60 197.6 262;-20 197.6 262;60 197.6 262" dur="6s" repeatCount="indefinite"/>
      <rect x="197.6" y="257.8" width="42.0" height="8.399999999999999" rx="3" fill="#fbbf24"/>
      <circle cx="239.6" cy="262" r="7.0" fill="#3b82f6"/>
    </g></g>
    </g>
  </g>

  <!-- right telemetry panel -->
  <g>
    <rect x="900" y="92" width="240" height="210" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(251,191,36,0.3)"/>
    <text x="918" y="118" font-family="DejaVu Sans Mono,monospace" font-size="11" fill="#fbbf24">sparkline /odom</text>
    <polyline points="918,150 930,144 942,150 954,138 966,146 978,130 990,142 1002,134 1014,140 1026,126 1038,136 1050,128 1062,132 1074,120 1086,130 1098,122 1110,126 1122,116" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <polyline points="918,172 930,170 942,166 954,168 966,162 978,164 990,158 1002,162 1014,156 1026,158 1038,152 1050,156 1062,150 1074,152 1086,148 1098,150 1110,144 1122,146" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>

    <text x="918" y="206" font-family="DejaVu Sans Mono,monospace" font-size="11" fill="#fbbf24">topics</text>
    <text x="918" y="228" font-family="DejaVu Sans Mono,monospace" font-size="12" fill="#e2e8f0">/odom <tspan fill="#38bdf8">&#10003;</tspan> <tspan fill="rgba(148,163,184,0.6)">10 Hz</tspan></text>
    <text x="918" y="250" font-family="DejaVu Sans Mono,monospace" font-size="12" fill="#e2e8f0">/scan <tspan fill="#38bdf8">&#10003;</tspan> <tspan fill="rgba(148,163,184,0.6)">20 Hz</tspan></text>
    <text x="918" y="272" font-family="DejaVu Sans Mono,monospace" font-size="12" fill="#e2e8f0">/joint_states <tspan fill="#fbbf24">&#10003;</tspan> <tspan fill="rgba(148,163,184,0.6)">30 Hz</tspan></text>
    <text x="918" y="294" font-family="DejaVu Sans Mono,monospace" font-size="12" fill="#e2e8f0">rosbag <tspan fill="#fbbf24">REC</tspan> <tspan fill="rgba(148,163,184,0.6)">01:23:45</tspan></text>
  </g>

  <!-- scan line -->
  <g class="scany">
    <rect x="0" y="-80" width="1200" height="80" fill="url(#scangrad)"/>
    <rect x="0" y="0" width="1200" height="2.5" fill="rgba(56,189,248,0.9)"/>
  </g>

  <!-- footer -->
  <text x="60" y="406" font-family="DejaVu Sans Mono,monospace" font-size="10" fill="rgba(148,163,184,0.5)">
    mobile-robot obstacle avoidance &#183; 3-DOF pick-and-place &#183; telemetry + offline analytics &#8212; headless AWS Ubuntu
  </text>
  <text x="1140" y="406" text-anchor="end" font-family="DejaVu Sans Mono,monospace" font-size="10" fill="rgba(148,163,184,0.5)">
    assets/hero.svg &#183; <tspan fill="#38bdf8">100</tspan><tspan fill="#fbbf24">% motion</tspan>
  </text>
</svg>
